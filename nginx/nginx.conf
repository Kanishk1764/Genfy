events {
    worker_connections 1024;
}

http {
    # ── Upstream containers ──────────────────────────────────────────
    upstream frontend {
        server genfy-frontend:3001;
        keepalive 16;
    }

    # ── HTTP Redirect Server Block ──────────────────────────────────
    server {
        listen 80;
        server_name genfyy.in www.genfyy.in;

        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS Server Block ─────────────────────────────────────
    server {
        listen 443 ssl;
        server_name genfyy.in www.genfyy.in;

        # SSL Configuration (Certificates mapped from host)
        ssl_certificate /etc/letsencrypt/live/genfyy.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/genfyy.in/privkey.pem;
        
        # Recommended strong SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Allow large image uploads (up to 50MB)
        client_max_body_size 50M;

        # Longer timeouts for image generation (can take 30-60s)
        proxy_read_timeout    180s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    180s;

        # All traffic → Next.js frontend
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward real client info to backend
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── Redirect bare IP requests → domain ──────────────────────────
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        
        # Dummy fallback cert so nginx doesn't crash on IP access
        ssl_certificate /etc/letsencrypt/live/genfyy.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/genfyy.in/privkey.pem;

        return 301 https://genfyy.in$request_uri;
    }
}
